<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/reset.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Sen:wght@700&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <header class="header">
      <div class="main-content">
        <div class="body">
          <img src="./assets/img/bensnik-logo.svg" alt="Bensnik Logo" />
          <nav class="nav">
            <ul>
              <li><a href="#">Home</a></li>
              <li><a href="#">Features</a></li>
              <li><a href="#">Pricing</a></li>
              <li><a href="#">About</a></li>
              <li><a href="#">Contact</a></li>
            </ul>
          </nav>
          <div class="action">
            <a href="#" class="sign-btn">Sign In</a>
            <a href="#" class="sign-btn">Sign Up</a>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="hero">
        <div class="main-content">
          <div class="body">
            <div class="hero-content">
              <p class="desc desc-large">😎 EASY LEARNING PLATFORM</p>
              <h1 class="heading">Words learner come here.</h1>
              <p class="sub-heading desc">
                Build skills with courses, certificates, and get online
                knowledge from our <br />
                world-class platform.
              </p>
              <div class="hero-action">
                <a href="#" class="get-started-btn btn">Get Started</a>
                <button class="play-btn">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="14"
                    height="18"
                    viewBox="0 0 14 18"
                    fill="none">
                    <path d="M14 9L0 0V18L14 9Z" fill="#1EBFC1" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="hero-media">
              <img
                src="./assets/img/hero-img.jpg"
                alt="hero-img"
                class="thumb" />
              <div class="info-courses">
                <div class="icon-courses">
                  <span class="icon-book">
                    <img src="./assets/icons/icon-book.svg" alt="icon-book" />
                  </span>
                  <p class="info-title">Courses 1000+</p>
                </div>
              </div>
              <div class="info-schedules">
                <p class="info-title">Schedules</p>
                <div class="group-schedules">
                  <img src="./assets/icons/Group 5533.svg" alt="" />
                  <img src="./assets/icons/Group 5532.svg" alt="" />
                  <img src="./assets/icons/Group 5531.svg" alt="" />
                  <img src="./assets/icons/Rectangle 3824.svg" alt="" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
